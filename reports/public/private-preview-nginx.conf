# INACTIVE EXAMPLE. Do not install or reload Nginx during Phase 6.
server {
    listen 443 ssl http2;
    server_name preview.example.invalid;

    root /var/www/rkreno-preview/current/public;
    index index.html;
    client_max_body_size 16k;

    # Add real certificate paths privately.
    ssl_certificate /etc/ssl/private/preview-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/preview-key.pem;

    auth_basic "Private RK Reno preview";
    auth_basic_user_file /etc/nginx/private/rkreno-preview.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/rkreno-preview.access.log;
    error_log /var/log/nginx/rkreno-preview.error.log;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }
}
