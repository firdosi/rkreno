# Enable only during the final DNS cutover. No default_server directive is used.
server {
  listen 80;
  listen [::]:80;
  server_name rkrenosolution.com www.rkrenosolution.com;
  return 301 https://rkrenosolution.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.rkrenosolution.com;

  ssl_certificate /etc/letsencrypt/live/rkrenosolution.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rkrenosolution.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://rkrenosolution.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name rkrenosolution.com;

  ssl_certificate /etc/letsencrypt/live/rkrenosolution.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rkrenosolution.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  include /etc/nginx/snippets/rkreno-site-common.conf;
}
