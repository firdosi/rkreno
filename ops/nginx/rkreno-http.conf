# Install as /etc/nginx/conf.d/rkreno-http.conf.
# Only rate-limit zone declarations live at http scope; all other settings stay
# inside RK Reno's virtual hosts so ConvortAI is unaffected.

limit_req_zone $binary_remote_addr zone=rkreno_form:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=rkreno_connection:10m;
