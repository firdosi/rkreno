root /var/www/rkreno/current/public;
index index.html;
server_tokens off;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
  application/javascript
  application/json
  application/ld+json
  application/manifest+json
  application/xml
  font/otf
  font/ttf
  image/svg+xml
  text/css
  text/plain;

include /etc/nginx/snippets/rkreno-security-headers.conf;
include /etc/nginx/snippets/rkreno-redirects.conf;

client_max_body_size 20k;

location = /api/enquiry {
  limit_req zone=rkreno_form burst=3 nodelay;
  limit_conn rkreno_connection 5;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_pass http://127.0.0.1:8787/api/enquiry;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
}

location = /api/health {
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_pass http://127.0.0.1:8787/health;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;
}

location ^~ /assets/ {
  try_files $uri =404;
  access_log off;
  expires 1y;
}

location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
  try_files $uri =404;
  access_log off;
  expires 7d;
}

location = /robots.txt {
  try_files $uri =404;
  expires -1;
}

location = /sitemap.xml {
  try_files $uri =404;
  expires 1h;
}

location / {
  try_files $uri $uri/ $uri/index.html =404;
  expires -1;
}

error_page 404 /404.html;
location = /404.html {
  internal;
}
